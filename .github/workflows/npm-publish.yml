name: Publish npm package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build package
        run: bun run build

      - name: Inspect npm identity
        run: |
          npm --version
          npm config get registry
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then echo "NODE_AUTH_TOKEN is set"; else echo "NODE_AUTH_TOKEN is not set"; fi
          npm whoami --registry https://registry.npmjs.org || true

      - name: Publish to npm with trusted publishing
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          npm publish --access public --provenance --ignore-scripts --registry https://registry.npmjs.org
